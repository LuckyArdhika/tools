<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern HTML Try-it Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Styling khusus untuk scrollbar agar terlihat modern ala IDE */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; 
    }
    ::-webkit-scrollbar-thumb {
      background: #334155; 
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569; 
    }
    
    /* Mencegah textarea di-resize manual karena kita pakai Flexbox */
    textarea {
      resize: none;
      tab-size: 2;
    }
  </style>
</head>
<body class="bg-slate-950 h-screen flex flex-col text-slate-200 overflow-hidden font-sans">

  <!-- Header / Navbar -->
  <header class="bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 py-3 shrink-0">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 p-2 rounded-lg text-white">
        <i data-lucide="code-2" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-slate-100 leading-tight">Live HTML Editor</h1>
        <p class="text-[10px] text-slate-400 font-mono">Render your imagination</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <!-- Toggle Live Preview -->
      <label class="flex items-center gap-2 cursor-pointer group">
        <input type="checkbox" id="auto-run" class="peer sr-only" checked>
        <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-500 relative"></div>
        <span class="text-xs font-semibold text-slate-400 group-hover:text-slate-200 transition-colors uppercase tracking-wider">Auto Run</span>
      </label>

      <div class="w-px h-6 bg-slate-700 mx-2"></div>

      <button id="btn-reset" class="flex items-center gap-2 px-3 py-2 text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        Reset
      </button>

      <button id="btn-run" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition-all active:scale-95 shadow-lg shadow-emerald-900/50">
        <i data-lucide="play" class="w-4 h-4 fill-current"></i>
        Run Code
      </button>
    </div>
  </header>

  <!-- Workspace area -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    
    <!-- Code Editor (Left) -->
    <section class="flex-1 flex flex-col lg:w-1/2 border-b lg:border-b-0 lg:border-r border-slate-800 bg-slate-950 relative">
      <div class="bg-slate-900/50 border-b border-slate-800 px-4 py-2 flex items-center gap-2 shrink-0">
        <i data-lucide="file-code-2" class="w-4 h-4 text-indigo-400"></i>
        <span class="text-xs font-mono text-slate-300">index.html</span>
      </div>
      
      <!-- Textarea Editor -->
      <textarea 
        id="code-editor" 
        spellcheck="false"
        class="flex-1 w-full bg-transparent text-slate-300 font-mono text-[13px] sm:text-sm p-4 focus:outline-none focus:ring-0 leading-relaxed"
      ></textarea>
    </section>

    <!-- Output / Result (Right) -->
    <section class="flex-1 flex flex-col lg:w-1/2 bg-white relative">
      <div class="bg-slate-100 border-b border-slate-200 px-4 py-2 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <i data-lucide="layout-template" class="w-4 h-4 text-slate-500"></i>
          <span class="text-xs font-bold text-slate-600 uppercase tracking-wider">Browser Output</span>
        </div>
        <div class="flex gap-1.5">
          <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-amber-400"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-400"></div>
        </div>
      </div>
      
      <!-- Iframe for rendering -->
      <iframe 
        id="output-frame" 
        class="w-full h-full border-none bg-white"
        title="Output"
      ></iframe>
    </section>

  </main>

  <script>
    // Inisialisasi ikon Lucide
    lucide.createIcons();

    // Boilerplate HTML Default
    const defaultCode = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
    }
    
    h1 {
      color: #4f46e5;
      margin-bottom: 0.5rem;
    }
    
    .card {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      text-align: center;
    }
    
    button {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
      transition: background-color 0.2s;
    }
    
    button:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hello, Developer!</h1>
    <p>Edit kodenya di sebelah kiri dan lihat hasilnya di sini.</p>
    <button onclick="alert('Ini alert dari JavaScript!')">Click Me!</button>
  </div>

  <script>
    console.log("Aplikasi siap!");
  <\/script>
</body>
</html>`;

    // DOM Elements
    const editor = document.getElementById('code-editor');
    const iframe = document.getElementById('output-frame');
    const btnRun = document.getElementById('btn-run');
    const btnReset = document.getElementById('btn-reset');
    const autoRunToggle = document.getElementById('auto-run');

    // Fungsi Render: Memasukkan value dari editor ke dalam atribut srcdoc iframe
    const renderCode = () => {
      const code = editor.value;
      iframe.srcdoc = code;
    };

    // Inisialisasi awal
    editor.value = defaultCode;
    renderCode();

    // Event Listener: Tombol Run Manual
    btnRun.addEventListener('click', renderCode);

    // Event Listener: Reset Code
    btnReset.addEventListener('click', () => {
      if(confirm('Apakah Anda yakin ingin mereset kode ke awal?')) {
        editor.value = defaultCode;
        renderCode();
      }
    });

    // Event Listener: Auto Run (Debounced)
    let timeout;
    editor.addEventListener('input', () => {
      if (autoRunToggle.checked) {
        clearTimeout(timeout);
        // Delay 500ms agar iframe tidak render setiap kali 1 huruf diketik (mengurangi lag)
        timeout = setTimeout(renderCode, 500); 
      }
    });

    // FITUR SPESIAL: Dukungan menekan tombol Tab pada Textarea
    editor.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        
        // Ambil posisi cursor
        const start = this.selectionStart;
        const end = this.selectionEnd;
        
        // Insert 2 spasi sebagai ganti Tab
        this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
        
        // Kembalikan posisi cursor
        this.selectionStart = this.selectionEnd = start + 2;
        
        // Trigger event input manual agar Auto Run merespons tab
        this.dispatchEvent(new Event('input'));
      }
    });
  </script>
</body>
</html>
